name: Nightly

# Every push to master publishes a signed pre-release APK under the rolling "nightly" tag.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-release.apk everything-panel-nightly.apk
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly everything-panel-nightly.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "nightly ($(date -u +%Y-%m-%d))" \
            --notes "Automatic build of master at ${GITHUB_SHA::7}. Built $(date -u +%Y-%m-%dT%H:%MZ)."
