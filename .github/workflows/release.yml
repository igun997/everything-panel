name: Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-apk.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-release.apk "everything-panel-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "everything-panel-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "everything-panel $GITHUB_REF_NAME" --generate-notes
