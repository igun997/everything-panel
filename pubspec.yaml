name: everything_panel
description: "everything-panel - one glass control panel for every server provider (Easypanel first). Freeware, all data stays on this device."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.2
  flutter_secure_storage: ^11.2.0
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  material_ui: ^1.11.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/api/
